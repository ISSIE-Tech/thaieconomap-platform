build-push-prod:
  stage: build-prod
  tags:
    - k8s-dev
  image:
    name: moby/buildkit:rootless
    entrypoint: ['']
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - rm -rf apps/frontend/.env
    - rm -rf apps/frontend/.env.example
    - cp apps/frontend/.env.prod apps/frontend/.env
    - rm -rf apps/frontend/.env.prod
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$CI_DEPLOY_USER\",\"password\":\"$CI_DEPLOY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend=dockerfile.v0 \
        --local context=. \
        --local dockerfile=apps/frontend \
        --opt filename=Dockerfile \
        --output type=image,\"name=$REGISTRY/$IMAGE_PATH:$CI_COMMIT_SHORT_SHA,$REGISTRY/$IMAGE_PATH:latest\",push=true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-prod:
  stage: deploy-prod
  image: alpine:latest
  script:
    - apk add --no-cache git yq
    - git clone https://gitlab-ci-token:${CI_DEPLOY_TOKEN}@gitlab.issie.dev/thaieconomap/thaieconomap-k8s-deployment.git
    - cd thaieconomap-k8s-deployment
    - yq eval ".spec.template.spec.containers[0].image = \"$REGISTRY/$IMAGE_PATH:$CI_COMMIT_SHORT_SHA\"" -i ./prod/thaieconomap-frontend/deployment.yaml
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git add .
    - git commit -m "Deploy $CI_COMMIT_SHORT_SHA to PROD"
    - git push origin main
  needs:
    - build-push-prod
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
