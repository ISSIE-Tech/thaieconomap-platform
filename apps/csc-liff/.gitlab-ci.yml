stages:
  - build-dev
  - deploy-dev

variables:
  REGISTRY: registry.issie.dev
  IMAGE_PATH: thaieconomap/thaieconomap-monorepo/csc-liff

build-push-dev:
  stage: build-dev
  tags:
    - k8s-dev
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - rm -rf apps/csc-liff/.env
    - cp apps/csc-liff/.env.dev apps/csc-liff/.env
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$CI_DEPLOY_USER\",\"password\":\"$CI_DEPLOY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend=dockerfile.v0 \
        --local context=. \
        --local dockerfile=apps/csc-liff \
        --opt filename=Dockerfile \
        --output type=image,\"name=$REGISTRY/$IMAGE_PATH/dev:$CI_COMMIT_SHORT_SHA\",push=true
  rules:
    - when: on_success

deploy-dev:
  stage: deploy-dev
  image: alpine:latest
  script:
    - apk add --no-cache git yq
    - git clone https://gitlab-ci-token:${CI_DEPLOY_TOKEN}@gitlab.issie.dev/thaieconomap/thaieconomap-k8s-deployment.git
    - cd thaieconomap-k8s-deployment
    - yq eval ".spec.template.spec.containers[0].image = \"$REGISTRY/$IMAGE_PATH/dev:$CI_COMMIT_SHORT_SHA\"" -i ./dev/csc-liff/deployment.yaml
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git add .
    - git commit -m "Deploy $CI_COMMIT_SHORT_SHA to DEV"
    # several app pipelines deploy at once; rebase on whatever landed in between and retry
    - for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push origin main && break; sleep $((RANDOM % 5 + 1)); done
  needs:
    - build-push-dev
  rules:
    - when: on_success

