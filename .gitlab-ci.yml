stages:
  - trigger

# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────
trigger-backend:
  stage: trigger
  trigger:
    include:
      - local: apps/backend/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/backend/**
          - packages/contracts/**
          - pnpm-lock.yaml
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == "main"

# ──────────────────────────────────────────────
# Gateway
# ──────────────────────────────────────────────
trigger-gateway:
  stage: trigger
  trigger:
    include:
      - local: apps/gateway/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/gateway/**
          - packages/contracts/**
          - pnpm-lock.yaml
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"

# ──────────────────────────────────────────────
# Frontend
# ──────────────────────────────────────────────
trigger-frontend:
