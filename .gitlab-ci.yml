workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

stages:
  - trigger

# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────
trigger-backend:
  stage: trigger
  trigger:
    include:
      - local: apps/backend/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/backend/**/*
        - packages/contracts/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/backend/**/*
        - packages/contracts/**/*

# ──────────────────────────────────────────────
# Gateway
# ──────────────────────────────────────────────
trigger-gateway:
  stage: trigger
  trigger:
    include:
      - local: apps/gateway/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/gateway/**/*
        - packages/contracts/**/*
    - if: $CI_COMMIT_BRANCH == "staging"
      changes:
        - apps/gateway/**/*
        - packages/contracts/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/gateway/**/*
