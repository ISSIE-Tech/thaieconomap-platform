stages:
  - trigger

variables:
  REGISTRY: registry.issie.dev

# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────
trigger-backend-dev:
  stage: trigger
  trigger:
    include:
      - local: apps/backend/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/backend/**
        - packages/contracts/**
        - pnpm-lock.yaml

trigger-backend-prod:
  stage: trigger
  trigger:
    include:
      - local: apps/backend/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/backend/**
        - packages/contracts/**
        - pnpm-lock.yaml

