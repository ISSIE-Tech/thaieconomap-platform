  trigger:
    include:
      - local: apps/frontend/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/frontend/**
          - packages/contracts/**
          - pnpm-lock.yaml
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"

# ──────────────────────────────────────────────
# Admin
# ──────────────────────────────────────────────
trigger-admin:
  stage: trigger
  trigger:
    include:
      - local: apps/admin/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/admin/**
          - packages/contracts/**
          - pnpm-lock.yaml
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == "main"
