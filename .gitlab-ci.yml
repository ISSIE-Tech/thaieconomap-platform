workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

stages:
  - trigger

# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────
trigger-backend:
  stage: trigger
  trigger:
    include:
      - local: apps/backend/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ──────────────────────────────────────────────
# Gateway
# ──────────────────────────────────────────────
trigger-gateway:
  stage: trigger
  trigger:
    include:
      - local: apps/gateway/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"

# ──────────────────────────────────────────────
# Frontend
# ──────────────────────────────────────────────
trigger-frontend:
  stage: trigger
  trigger:
    include:
      - local: apps/frontend/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"

# ──────────────────────────────────────────────
# Admin
# ──────────────────────────────────────────────
trigger-admin:
  stage: trigger
  trigger:
    include:
      - local: apps/admin/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
